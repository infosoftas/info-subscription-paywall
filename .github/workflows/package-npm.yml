name: Release npm Package

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  pack:
    name: Build and pack npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Set package version and pack
        run: |
          npm version "$RELEASE_TAG" --no-git-tag-version --allow-same-version
          node -e 'if (require("./package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: pack
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: npm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@^11.5.1
      - name: Publish with trusted publishing
        working-directory: npm
        run: |
          shopt -s nullglob
          packages=(./*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one npm package, found ${#packages[@]}"
            exit 1
          fi
          npm_tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then
            npm_tag=next
          fi
          npm publish "${packages[0]}" --access public --tag "$npm_tag"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
